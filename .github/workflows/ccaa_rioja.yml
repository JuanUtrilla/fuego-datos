name: La Rioja, IPOGIF
# Una fecha de referencia al día (el 07/11/2026 a las 13 UTC la última era la
# del 06/11, con D+1 = 07/11). Si una pasada falla, la siguiente recupera la
# referencia anterior.
on:
  schedule:
    - cron: "45 7,13,19 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  bajar:
    uses: ./.github/workflows/_bajar.yml
    with:
      jobs: "rio-ipogif"
      minutos: 15
    secrets: inherit
